[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rfc-atlas"
version = "0.1.0"
description = "A structured, deterministic ingestion and chunking pipeline for IETF RFCs."
requires-python = ">=3.11"
authors = [
    { name = "Viswajith K S" }
]
dependencies = [
    "pydantic>=2.0.0",
    "lxml==5.1.0",
    "lxml-stubs==0.5.1",
    "pebble>=5.0.7"
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "ruff>=0.3.0",
    "pyright>=1.1.350"
]

[tool.setuptools.packages.find]
include = [
    "chunking*", "evaluation*", "graph*", "ingestion*", "metadata*",
    "normalization*", "parsers*", "retrieval*", "scripts*", "utils*"
]
exclude = [
    "data*", "notebooks*", "tests*"
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    "**/__pycache__",
    "data",
    "**/node_modules",
    "**/.*",
]
# Enabled preview mode to activate the superior `DOC` ruleset
preview = true

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "C90", "COM", "D", "DOC", "DTZ",
    "E", "W", "EM", "ERA", "EXE", "F", "FA", "FAST", "FBT", "FIX", "FLY", "FURB",
    "G", "I", "ICN", "INP", "INT", "ISC", "LOG", "N", "PERF", "PGH", "PIE", "PL",
    "PT", "PTH", "Q", "RET", "RSE", "RUF", "S", "SIM", "SLF", "SLOT", "T10", "T20",
    "TC", "TD", "TID", "TRY", "UP", "YTT",
]
ignore = [
    "E501",    # Line too long
    "PLR2004", # Magic value comparison

    # Formatter Incompatibilities: Prevents looping conflicts with `ruff format`
    "COM812", "ISC001", "E203", "D206",

    # Redundant or Unsafe Pylint Rules: keep the safer Flake8 equivalents
    "PLR1711",

    # Wave 2 Diplomatic Immunities (Dogmatic rules that harm domain modeling)
    "PLR6301", # no-self-use: Forcing @staticmethod degrades class inheritance
    "G004",    # logging-f-string: Modern Python 3.11+ f-strings are preferred
    "FIX",     # flake8-fixme: Allow TODO comments for Phase 3 roadmap tracking
    "TD",      # flake8-todos: Aesthetically overly restrictive TODO formatting

    # Docstring constraints
    "D417", # Redundant Docstring Check: The new DOC suite does this better
    "D203", # Ignored in favor of D211 (no blank lines before class docstring)
    "D213"  # Ignored in favor of D212 (summary on the first line)
]

[tool.ruff.lint.flake8-type-checking]
# Exempt Pydantic from TC rules to prevent NameError crashes at runtime
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
runtime-evaluated-decorators = ["pydantic.validate_call"]

[tool.ruff.lint.per-file-ignores]
# S101: Allows Python's standard 'assert' statements in tests
# D: Completely ignores all pydocstyle rules inside the tests directory
# SLF001: Allow unit tests to inspect and assert internal private helper methods
# INP001: Allow loose test files without requiring __init__.py package markers
"tests/**/*.py" = ["S101", "D", "SLF001", "INP001"]

# T201: Allow explicit print() statements in CLI execution scripts
# INP001: Exclude loose CLI execution directories from requiring __init__.py
"scripts/**/*.py" = ["T201", "INP001"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 50
max-returns = 6

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
exclude = [
    "**/__pycache__",
    "data",
    "**/node_modules",
    "**/.*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"

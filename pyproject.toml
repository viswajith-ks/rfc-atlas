[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rfc-atlas"
version = "0.1.0"
description = "A structured, deterministic ingestion and chunking pipeline for IETF RFCs."
requires-python = ">=3.11"
authors = [
    { name = "Viswajith K S" }
]
dependencies = [
    "pydantic>=2.0.0",
    "lxml==5.1.0",
    "lxml-stubs==0.5.1",
    "pebble>=5.0.7"
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "ruff>=0.3.0"
]

[tool.setuptools.packages.find]
include = [
    "chunking*",
    "evaluation*",
    "graph*",
    "ingestion*",
    "metadata*",
    "normalization*",
    "parsers*",
    "retrieval*",
    "scripts*",
    "utils*"
]
exclude = [
    "data*",
    "notebooks*",
    "tests*"
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".venv",
    "__pycache__",
    "data",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (Errors)
    "W",   # pycodestyle (Warnings)
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "ANN", # flake8-annotations
    "D",   # pydocstyle
    "PT",  # flake8-pytest-style
    "TCH", # flake8-type-checking
    "RUF", # Ruff-specific rules
    "C90", # mccabe (Cyclomatic Complexity)
    "PL",  # Pylint (Structural design limits)
]
ignore = [
    "E501",   # Line too long
    "PLR2004" # Magic value comparison
]

[tool.ruff.lint.per-file-ignores]
# S101: Allows python's standard 'assert' statements in tests
# D: Completely ignores all pydocstyle (documentation) rules inside the tests directory
"tests/**/*.py" = ["S101", "D"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 50
max-returns = 6

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
exclude = [
    "**/__pycache__",
    ".venv",
    "data",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
